name: Build and Release ConvoLink Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & Verify Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification test suite
        run: bun test

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Ensure packaging dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build extension packages for Chrome and Firefox
        run: bun run build:extension

      - name: Upload Extension Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: convolink-companion-extensions
          path: |
            extensions/convolink-companion/dist/*.zip
            extensions/convolink-companion/.output/*.zip
          include-hidden-files: true
          retention-days: 14

      - name: Publish GitHub Release (on tags or manual trigger)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "ConvoLink Companion ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            extensions/convolink-companion/dist/*.zip
