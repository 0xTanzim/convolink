<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvoLink Companion</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #18181b;
      color: #fafafa;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      background: #27272a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #a1a1aa;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      padding: 8px;
      background: #27272a;
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
    }
    .dot.connected { background: #22c55e; }
    .dot.unauthorized { background: #ef4444; }
    .dot.disconnected { background: #71717a; }
    label {
      font-size: 12px;
      color: #a1a1aa;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 6px;
      background: #3b82f6;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover {
      background: #2563eb;
    }
    .help {
      font-size: 11px;
      color: #71717a;
      line-height: 1.4;
    }
    code {
      background: #27272a;
      padding: 1px 4px;
      border-radius: 3px;
      color: #e4e4e7;
    }
  </style>
</head>
<body>
  <h2>ConvoLink Bridge <span class="badge" id="browserBadge">Chrome</span></h2>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking status...</span>
  </div>
  <div>
    <label for="profileInput">Profile Nickname</label>
    <input type="text" id="profileInput" placeholder="e.g. Work, Creative, Personal">
    <label for="tokenInput">Pairing Token</label>
    <input type="password" id="tokenInput" placeholder="Enter token from 'convo ext pair'">
    <button id="saveBtn">Save Settings & Connect</button>
  </div>
  <div class="help">
    Run <code>convo ext pair</code> in terminal to get your local pairing token.
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
